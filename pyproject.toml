[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS multi-agent platform: core contracts, policy, audit and routing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2,<4"]
# API gateway for the command deck (core, net-gateway). Domain workers do not need it.
gateway = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "websockets>=15,<17", "webauthn>=3.0,<4"]
# Git gateway (core): signs GitHub App JWTs.
gitgateway = ["cryptography>=45,<51"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "websockets>=15,<17",
    "webauthn>=3.0,<4",
    "cryptography>=45,<51",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core/jarvis_core",
    "modules/mod-content/mod_content",
    "modules/mod-private/mod_private",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis_core", "mod_content"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["core", "modules/mod-content", "modules/mod-private"]
packages = ["jarvis_core", "mod_content", "mod_private"]
exclude = ["modules/mod-content/sandbox/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL server (JARVIS_TEST_PG_DSN or local initdb)",
    "docker: starts the Compose stack in Docker (JARVIS_TEST_DOCKER=1)",
]
