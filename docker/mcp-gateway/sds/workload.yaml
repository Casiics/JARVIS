# The gateway's workload certificate, for envoy.yaml's TLS listener (one secret per file).
# pki-issue swaps the files by renaming a symlink inside /certs; watched_directory makes
# Envoy reload them on that rename (docs/runbooks/audit-hardening.md, section 3).
resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: workload
    tls_certificate:
      certificate_chain: { filename: /certs/tls.crt }
      private_key: { filename: /certs/tls.key }
      watched_directory: { path: /certs }
