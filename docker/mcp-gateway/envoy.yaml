# Policy gateway in front of one domain's MCP server (docs/architecture.md, section 7).
#
# Agents reach the MCP server only through this Envoy. Every request is checked by the
# domain's OPA (ext_authz, policies/mcp/authz.rego) with the JSON-RPC body attached; if OPA
# is unreachable or slow, the request is refused (fail closed). Upstream names are network
# aliases on net-mcp-<domain>, so the same file serves every domain:
#   mcp-upstream:5678  the domain's n8n (MCP Server Trigger endpoints under /mcp/)
#   opa:9191           the domain's OPA (Envoy ext_authz gRPC plugin)
# There is no admin interface.

overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 1024

static_resources:
  listeners:
    - name: mcp
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp
                codec_type: HTTP1
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                use_remote_address: true
                server_header_transformation: APPEND_IF_ABSENT
                stream_idle_timeout: 300s
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        # Method, path and status only: no bodies, no query strings, no headers.
                        text_format_source:
                          inline_string: "%START_TIME% %DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% %REQ(:METHOD)% %REQ(:PATH):128% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%\n"
                route_config:
                  name: mcp
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/mcp/" }
                          route:
                            cluster: mcp_upstream
                            timeout: 0s
                            idle_timeout: 300s
                        - match: { prefix: "/" }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      status_on_error: { code: 503 }
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: false
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: mcp_upstream
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mcp_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mcp-upstream, port_value: 5678 }
    - name: opa
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 9191 }
