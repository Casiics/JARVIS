name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JARVIS_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy tests
      - run: uv run pytest -v
      # Phase 7 exit criterion, named so a failure is visible on its own: a self-improvement
      # PR against the risk engine or the order path is refused by the git gateway.
      - name: Auto-PR against the risk engine is rejected
        run: uv run pytest -v tests/selfimprove/test_exit_criterion.py

  deck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.models.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.debug.yml config -q

  policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: OPA policy tests
        run: |
          opa="docker run --rm -v $PWD/policies:/policies:ro openpolicyagent/opa:1.21.2-static"
          $opa check --strict /policies/mcp
          $opa test -v /policies/mcp
          test -z "$($opa fmt --list /policies/mcp)" || { echo "run opa fmt -w"; exit 1; }
      - name: Proxy configurations parse
        run: |
          docker run --rm --entrypoint envoy -v $PWD/docker/mcp-gateway/envoy.yaml:/e.yaml:ro \
            -v $PWD/docker/mcp-gateway/sds:/etc/envoy/sds:ro \
            envoyproxy/envoy:v1.37.2 --mode validate -c /e.yaml
          docker run --rm --entrypoint /usr/sbin/squid \
            -v $PWD/docker/egress/squid.conf:/etc/jarvis/squid.conf:ro \
            -v $PWD/policies/egress/core.allow:/etc/jarvis/egress.allow:ro \
            ubuntu/squid:6.6-24.04_beta -k parse -f /etc/jarvis/squid.conf
          docker run --rm --entrypoint sh -e JARVIS_CALDAV_HOST=cal.example.org \
            -e JARVIS_IMAP_HOST=imap.example.org \
            -v $PWD/docker/egress-private/nginx.conf.template:/t:ro nginx:1.28.0-alpine -c \
            'envsubst "\$JARVIS_CALDAV_HOST \$JARVIS_IMAP_HOST" < /t > /tmp/n.conf && nginx -t -c /tmp/n.conf'

  # Phase 4 exit criterion: the real stack in Docker, probed from each network position.
  # Also runs the Phase 7 audit keeper and workload CA live (builds the keeper image).
  isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -v -m docker tests/isolation
        env:
          JARVIS_TEST_DOCKER: "1"

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .
